[package]
name = "averon-fetch"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
default-run = "averon-fetch"
authors = ["Averon Software Foundation"]
description = "A modern, lightweight system information utility"
license = "GPL-3.0-or-later"
repository = "https://github.com/Averon-Software-Foundation/Averon-Fetch"
readme = "README.md"

[lib]
name = "averon_fetch"
path = "src/lib.rs"

[[bin]]
name = "averon-fetch"
path = "src/main.rs"

[[bin]]
name = "av-fetch"
path = "src/bin/av-fetch.rs"

# Generates shell completions and man pages for release archives. Kept behind
# the `docs` feature so the shipped binaries do not carry these dependencies.
[[bin]]
name = "gen-docs"
path = "src/bin/gen-docs.rs"
required-features = ["docs"]

[features]
docs = ["dep:clap_complete", "dep:clap_mangen"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.3", optional = true }
# Only `System` (CPU, memory, hostname, kernel, uptime) is used. The default
# features pull in disk/network/user/component support and `rayon`, none of
# which this tool needs.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"

[profile.release]
opt-level = 3
# Thin LTO links noticeably faster than fat LTO here while producing the same
# runtime performance for this workload. `codegen-units = 1` keeps the binary
# small; raise it to 16 for another ~3s of build time at the cost of ~200KB.
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
# Line tables only: keeps backtraces readable while cutting link time and
# target/ size. Use `debug = 2` locally if you need variable inspection.
debug = 1
