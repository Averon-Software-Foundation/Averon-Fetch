name: CI

on:
  # Only the default branch runs CI on push: every other branch is covered by
  # the pull request trigger below. Running both on the same commit left two
  # check suites on a PR's head commit, so cancelling the duplicate push run
  # showed the pull request as failing. Tags are included so release candidates
  # are tested before the release jobs run.
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  # All pull requests, regardless of their target branch.
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref. Pull requests cancel superseded runs, branch and tag
  # pushes are allowed to finish so a release build is never cancelled.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      # Report every combination independently instead of stopping early.
      fail-fast: false
      matrix:
        include:
          # The official Arch Linux image is amd64-only, so Arch is covered
          # there and arm64 is covered by Debian on a native arm64 runner.
          - name: Arch Linux
            slug: arch
            distro: arch
            arch: x86_64
            runner: ubuntu-latest
            image: archlinux:latest
          - name: Debian
            slug: debian
            distro: debian
            arch: x86_64
            runner: ubuntu-latest
            image: debian:stable-slim
            target: x86_64-unknown-linux-musl
          - name: Debian
            slug: debian-arm64
            distro: debian
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: debian:stable-slim
            target: aarch64-unknown-linux-musl

    steps:
      - name: Install dependencies (Arch Linux)
        if: matrix.distro == 'arch'
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed git base-devel rust
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Install dependencies (Debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential binutils file

      - name: Install Rust toolchain (Debian)
        if: matrix.distro == 'debian'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable \
                --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # The workspace is mounted from the host, so git needs it trusted
      # before checkout can operate on it.
      - name: Trust workspace directory
        run: git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.slug }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.slug }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # The release archive's completions and man pages come from a
      # feature-gated helper, so compile it on every run, not only on tags.
      - name: Check docs generator
        run: cargo check --locked --features docs --bin gen-docs

      # Run the test suite before the expensive release-profile build so a
      # logic failure fails fast.
      - name: Run tests
        run: cargo test --locked --all-targets

      # `--all-targets` skips documentation tests, so run those explicitly.
      - name: Run documentation tests
        run: cargo test --locked --doc

      # Catch broken intra-doc links and malformed documentation while it is
      # still cheap to fix.
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Build (debug)
        run: cargo build --locked

      # Run every module and assert that the collectors which must work
      # everywhere produced output, not just that the process exited zero.
      - name: Smoke test binaries
        run: |
          ./target/debug/averon-fetch --version
          ./target/debug/av-fetch --version
          ./target/debug/averon-fetch --no-logo --no-color > /dev/null
          ./target/debug/averon-fetch --list-modules > /dev/null
          ./target/debug/averon-fetch --all --format json > /tmp/averon-fetch-all.json
          grep -Eq '"module"[[:space:]]*:[[:space:]]*"os"' /tmp/averon-fetch-all.json
          grep -Eq '"module"[[:space:]]*:[[:space:]]*"network"' /tmp/averon-fetch-all.json

      # Release artifacts are statically linked against musl so they run on
      # glibc and musl distributions alike, including older ARM boards.
      - name: Build (musl static)
        if: matrix.distro == 'debian'
        run: |
          # Rust's self-contained musl linking ships the target's libc and
          # startup objects, so no host musl-gcc is required.
          rustup target add "${{ matrix.target }}"
          cargo build --locked --release --target "${{ matrix.target }}"
          for bin in averon-fetch av-fetch; do
            binary="target/${{ matrix.target }}/release/$bin"
            info="$(file "$binary")"
            case "$info" in
              *"statically linked"*|*"static-pie linked"*) ;;
              *) echo "expected a statically linked binary: $binary ($info)" >&2; exit 1 ;;
            esac
            dynamic="$(readelf -d "$binary" 2>/dev/null || true)"
            case "$dynamic" in
              *NEEDED*) echo "expected a statically linked binary: $binary" >&2; exit 1 ;;
            esac
          done

      # Exercise the static binary on both architectures against a minimal
      # image, where missing tools (iproute2, coreutils, pciutils) would
      # otherwise go unnoticed.
      - name: Smoke test musl binary
        if: matrix.distro == 'debian'
        run: |
          binary="target/${{ matrix.target }}/release/averon-fetch"
          "$binary" --version
          "target/${{ matrix.target }}/release/av-fetch" --version
          "$binary" --list-modules > /dev/null
          "$binary" --all --format json > /tmp/averon-fetch-musl.json
          grep -Eq '"module"[[:space:]]*:[[:space:]]*"os"' /tmp/averon-fetch-musl.json
          grep -Eq '"module"[[:space:]]*:[[:space:]]*"network"' /tmp/averon-fetch-musl.json

      # Hand the exact binaries built and tested here to the release job so it
      # packages the validated artifact instead of rebuilding a new one.
      - name: Stage musl binaries
        if: matrix.distro == 'debian' && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p build
          cp "target/${{ matrix.target }}/release/averon-fetch" \
             "target/${{ matrix.target }}/release/av-fetch" \
             build/

      - name: Upload musl binaries
        if: matrix.distro == 'debian' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: musl-${{ matrix.arch }}
          path: build/*
          if-no-files-found: error

  msrv:
    name: MSRV (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    container: debian:stable-slim
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.95.0']

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${{ matrix.rust }}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The workspace is mounted from the host, so git needs it trusted
      # before checkout can operate on it.
      - name: Trust workspace directory
        run: git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            msrv-cargo-

      # Fail if the declared minimum is not the toolchain in use, then prove
      # the locked dependency set still builds and passes tests on it.
      - name: Build and test on minimum supported Rust
        run: |
          rustc --version | grep -F " ${{ matrix.rust }} "
          cargo check --locked --features docs --bin gen-docs
          cargo build --locked --all-targets
          cargo test --locked --all-targets

  # Dependency policy: advisories, licences, duplicate versions, and sources.
  # Runs on every push and pull request, not just at release time.
  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check
          arguments: --all-features

  # Release archives include man pages and shell completions. Generating them
  # here keeps the release job free of a Rust toolchain.
  docs:
    name: Generate completions and man pages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Trust workspace directory
        run: git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: docs-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            docs-cargo-

      - name: Generate man pages and completions
        run: |
          cargo build --locked --features docs --bin gen-docs
          ./target/debug/gen-docs docs
          test -s docs/share/man/man1/averon-fetch.1
          test -s docs/share/man/man1/av-fetch.1
          test -s docs/share/bash-completion/completions/averon-fetch
          test -s docs/share/zsh/site-functions/_averon-fetch
          test -s docs/share/fish/vendor_completions.d/averon-fetch.fish

      - name: Upload docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs
          path: docs
          if-no-files-found: error

  release:
    name: Release build (${{ matrix.arch }})
    # Package the musl binaries the test job built and smoke-tested, so the
    # published archives are exactly the artifacts CI validated. The archive
    # metadata is fixed so repeated packaging of the same binaries is stable.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, docs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            file_arch: x86-64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            file_arch: ARM aarch64
    runs-on: ${{ matrix.runner }}
    container: debian:stable-slim
    timeout-minutes: 20

    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates binutils file

      - name: Trust workspace directory
        run: git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Catch a tag that does not match Cargo.toml before publishing artifacts
      # under the wrong version.
      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          # Read only the [package] table, tolerating arbitrary whitespace and
          # other tables that may contain their own `version` keys.
          package_version="$(
            awk '
              /^\[package\]$/ { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && /^version[[:space:]]*=/ {
                sub(/^version[[:space:]]*=[[:space:]]*"/, "")
                sub(/".*$/, "")
                print
                exit
              }
            ' Cargo.toml
          )"
          if [ -z "$package_version" ]; then
            echo "could not read the package version from Cargo.toml" >&2
            exit 1
          fi
          if [ "$tag_version" != "$package_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $package_version" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches Cargo.toml version $package_version"

      - name: Download tested musl binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: musl-${{ matrix.arch }}
          path: build

      - name: Download generated docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docs
          path: docs

      # Artifact uploads do not preserve the executable bit, so restore it
      # before packaging and running the binaries.
      - name: Restore executable permissions
        run: chmod +x build/averon-fetch build/av-fetch

      - name: Verify static linking and architecture
        run: |
          for bin in averon-fetch av-fetch; do
            binary="build/$bin"
            test -x "$binary" || { echo "not executable: $binary" >&2; exit 1; }
            info="$(file "$binary")"
            case "$info" in
              *"statically linked"*|*"static-pie linked"*) ;;
              *) echo "not statically linked: $binary ($info)" >&2; exit 1 ;;
            esac
            case "$info" in
              *"${{ matrix.file_arch }}"*) ;;
              *) echo "wrong architecture: $binary ($info)" >&2; exit 1 ;;
            esac
            dynamic="$(readelf -d "$binary" 2>/dev/null || true)"
            case "$dynamic" in
              *NEEDED*) echo "release binary is dynamically linked: $binary" >&2; exit 1 ;;
            esac
          done

      - name: Package release
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="averon-fetch-${version}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          install -m755 build/averon-fetch build/av-fetch "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          cp -R docs/share "dist/${name}/"
          tar --sort=name --mtime='@0' \
              --owner=0 --group=0 --numeric-owner \
              -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"
          ls -l dist

      # Re-extract and run the archive that will be uploaded, so packaging
      # mistakes cannot silently ship an untested layout.
      - name: Smoke test packaged archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/averon-fetch-${version}-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p smoke
          tar -xzf "$archive" -C smoke
          dir="smoke/averon-fetch-${version}-linux-${{ matrix.arch }}"
          "$dir/averon-fetch" --version
          "$dir/av-fetch" --version
          "$dir/averon-fetch" --list-modules > /dev/null
          "$dir/averon-fetch" --all --format json > smoke/all.json
          grep -Eq '"module"[[:space:]]*:[[:space:]]*"os"' smoke/all.json
          grep -Eq '"module"[[:space:]]*:[[:space:]]*"network"' smoke/all.json
          test -s "$dir/share/man/man1/averon-fetch.1"
          test -s "$dir/share/man/man1/av-fetch.1"
          test -s "$dir/share/bash-completion/completions/averon-fetch"
          test -s "$dir/share/zsh/site-functions/_averon-fetch"
          test -s "$dir/share/fish/vendor_completions.d/averon-fetch.fish"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  verify-musl:
    name: Verify musl runtime (${{ matrix.arch }})
    # The static binaries are also run inside Alpine, the musl distribution
    # the release build is meant to support, not only on the glibc host.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist

      - name: Run packaged binary on Alpine
        run: |
          mkdir -p rootfs
          tar -xzf dist/*.tar.gz -C rootfs
          dir="$(find rootfs -maxdepth 1 -type d -name 'averon-fetch-*' -print -quit)"
          docker run --rm -v "$PWD/${dir}:/app:ro" alpine:latest /app/averon-fetch --version
          docker run --rm -v "$PWD/${dir}:/app:ro" alpine:latest /app/av-fetch --version
          docker run --rm -v "$PWD/${dir}:/app:ro" alpine:latest \
            /app/averon-fetch --list-modules > /dev/null
          docker run --rm -v "$PWD/${dir}:/app:ro" alpine:latest \
            /app/averon-fetch --all --format json > alpine-all.json
          grep -Eq '"module"[[:space:]]*:[[:space:]]*"os"' alpine-all.json
          grep -Eq '"module"[[:space:]]*:[[:space:]]*"network"' alpine-all.json

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ release, verify-musl ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Publish SLSA build provenance for the archives, verifiable with
      # `gh attestation verify <archive> --repo <owner>/<repo>`.
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Publish assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # This job does not check out the repository, so GH_REPO above tells
          # gh which repository the release belongs to.
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
