name: CI

on:
  # Every branch gets CI so each pushed commit is checked. Tags are included
  # so release candidates are tested before the release jobs run.
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  # All pull requests, regardless of their target branch.
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref. Pull requests cancel superseded runs, branch and tag
  # pushes are allowed to finish so a release build is never cancelled.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      # Report every combination independently instead of stopping early.
      fail-fast: false
      matrix:
        include:
          # The official Arch Linux image is amd64-only, so Arch is covered
          # there and arm64 is covered by Debian on a native arm64 runner.
          - name: Arch Linux
            slug: arch
            distro: arch
            arch: x86_64
            runner: ubuntu-latest
            image: archlinux:latest
          - name: Debian
            slug: debian
            distro: debian
            arch: x86_64
            runner: ubuntu-latest
            image: debian:stable-slim
            target: x86_64-unknown-linux-musl
          - name: Debian
            slug: debian-arm64
            distro: debian
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: debian:stable-slim
            target: aarch64-unknown-linux-musl

    steps:
      - name: Install dependencies (Arch Linux)
        if: matrix.distro == 'arch'
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed git base-devel rust
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Install dependencies (Debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential musl-tools

      - name: Install Rust toolchain (Debian)
        if: matrix.distro == 'debian'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable \
                --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # The workspace is mounted from the host, so git needs it trusted
      # before checkout can operate on it.
      - name: Trust workspace directory
        run: git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.slug }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.slug }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build (debug)
        run: cargo build --locked

      - name: Build (release)
        run: cargo build --locked --release

      # Release artifacts are statically linked against musl so they run on
      # glibc and musl distributions alike, including older ARM boards.
      - name: Build (musl static)
        if: matrix.distro == 'debian'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --locked --release --target "${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/averon-fetch"
          if readelf -d "$binary" | grep -q NEEDED; then
            echo "expected a statically linked binary: $binary" >&2
            exit 1
          fi

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Smoke test binaries
        run: |
          ./target/debug/averon-fetch --version
          ./target/debug/av-fetch --version
          ./target/debug/averon-fetch --format json > /dev/null
          ./target/debug/averon-fetch --no-logo --no-color > /dev/null
          ./target/debug/averon-fetch --list-modules > /dev/null
          ./target/debug/averon-fetch --all --format json > /dev/null

      # Exercise the shipped static binary on both architectures. This runs the
      # full collector set against minimal images, which is where missing
      # tools (iproute2, coreutils, pciutils) would otherwise go unnoticed.
      - name: Smoke test musl binary
        if: matrix.distro == 'debian'
        run: |
          binary="target/${{ matrix.target }}/release/averon-fetch"
          "$binary" --version
          "$binary" --list-modules > /dev/null
          "$binary" --all --format json > /dev/null

  release:
    name: Release build (${{ matrix.arch }})
    # Build releases on Debian so the shipped binaries are reproducible and
    # architecture-native. The musl target keeps them statically linked, which
    # lets the same archive run on glibc and musl distributions (Alpine, older
    # ARM boards) without matching the host C library.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    container: debian:stable-slim

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential musl-tools file

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Trust workspace directory
        run: git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --locked --release --target "${{ matrix.target }}"

      - name: Verify static linking
        run: |
          binary="target/${{ matrix.target }}/release/averon-fetch"
          if readelf -d "$binary" | grep -q NEEDED; then
            echo "release binary is dynamically linked: $binary" >&2
            exit 1
          fi
          file "$binary"

      - name: Package release
        run: |
          version="${GITHUB_REF_NAME#v}"
          arch="$(uname -m)"
          name="averon-fetch-${version}-linux-${arch}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/averon-fetch" \
             "target/${{ matrix.target }}/release/av-fetch" \
             "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"
          ls -l dist

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
